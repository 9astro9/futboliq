<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTBOLIQ</title><style>:root{--bg:#0b1020;--card:#121a2e;--text:#f4f6fb;--muted:#9da7bb;--accent:#36d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui;max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:800}.ball{width:40px;height:40px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center}.card{background:var(--card);border-radius:16px;padding:22px;margin-top:20px}button,input{font:inherit;border-radius:10px;padding:12px}button{border:0;cursor:pointer;background:var(--accent);color:#06120d;font-weight:700;margin:5px}input{width:100%;border:1px solid #33405d;background:#0d1425;color:white;margin:5px 0}.opts button{display:block;width:100%;text-align:left;background:#202b45;color:white}.hidden{display:none}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #28344d}</style></head><body><header><div class="brand"><span class="ball">F</span>FUTBOLIQ</div><div id="who"></div></header><section id="auth" class="card"><h2>Cuenta</h2><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button onclick="reg()">Crear cuenta</button><button onclick="login()">Iniciar sesión</button><p id="msg" class="muted"></p></section><section id="game" class="card hidden"><div id="q"></div><div class="opts" id="opts"></div><p>Puntos: <b id="score">0</b></p><button onclick="logout()">Cerrar sesión</button></section><section class="card"><h2>Ranking global</h2><table><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Partidas</th></tr></thead><tbody id="rank"></tbody></table></section><script>let game=null,score=0;const $=x=>document.getElementById(x);async function api(p,o={}){return fetch(p,{headers:{"content-type":"application/json"},...o}).then(x=>x.json())}async function reg(){let x=await api("/api/register",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("msg").textContent=x.error||"Cuenta creada";if(x.user)start()}async function login(){let x=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("msg").textContent=x.error||"";if(x.user)start()}async function start(){let x=await api("/api/game",{method:"POST",body:"{}"});game=x.gameId;score=0;$("auth").classList.add("hidden");$("game").classList.remove("hidden");show(x.question)}function show(q){$("q").innerHTML="<h2>"+q.q+"</h2><p class='muted'>"+q.category+"</p>";$("opts").innerHTML=q.options.map((o,i)=>"<button onclick='ans("+i+")'>"+o+"</button>").join("")}async function ans(i){let x=await api("/api/answer",{method:"POST",body:JSON.stringify({gameId:game,choice:i})});score=x.score;$("score").textContent=score;if(x.done){alert("Partida terminada. Puntos: "+score);game=null;load()}else show(x.question)}async function load(){let x=await api("/api/ranking");$("rank").innerHTML=x.ranking.map((r,i)=>"<tr><td>"+(i+1)+"</td><td>"+r.username+"</td><td>"+r.score+"</td><td>"+r.games+"</td></tr>").join("")}async function logout(){await api("/api/logout",{method:"POST",body:"{}"});location.reload()}load();</script></body></html>
