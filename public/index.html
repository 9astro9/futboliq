<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTBOLIQ — Quiz de fútbol</title><link rel="icon" href="data:,">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{--bg:#080c15;--card:#111827;--card2:#0d1422;--text:#f3f4f6;--muted:#9ca3af;--line:#263247;--accent:#35d39a;--danger:#f87171;--shadow:0 14px 35px rgba(0,0,0,.25)}
:root.light{--bg:#eef2f7;--card:#fff;--card2:#f7f9fc;--text:#101827;--muted:#5f6b7b;--line:#d9e0ea;--shadow:0 10px 25px rgba(15,23,42,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(53,211,154,.08),transparent 25%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;letter-spacing:-.04em}.logo{width:42px;height:42px;border:2px solid var(--accent);border-radius:13px;position:relative;display:grid;place-items:center;font-weight:950}.logo:before{content:"";width:15px;height:15px;border:2px solid var(--accent);border-radius:50%}.actions{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#06130e;font-weight:800}.btn.danger{background:transparent;border-color:rgba(248,113,113,.45);color:var(--danger)}.grid{display:grid;grid-template-columns:1.6fr .9fr;gap:18px;margin-top:20px}.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.hidden{display:none!important}.muted{color:var(--muted)}.title{font-size:30px;margin:0 0 5px}.hero{padding:34px}.question{font-size:24px;line-height:1.25;margin:10px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:var(--card2)}.status{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}.status strong{color:var(--text)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}.auth{max-width:440px;margin:26px auto}.field{display:grid;gap:6px;margin:10px 0}input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text)}.tabs{display:flex;gap:8px;margin-bottom:15px}.settings{display:grid;gap:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.dev table button{padding:6px 8px;margin:2px}.small{font-size:13px}.notice{min-height:22px}.footer{padding:22px 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{padding:22px}.question{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><span class="logo">F</span><span>FUTBOLIQ</span></div>
  <div class="actions">
    <button class="btn" onclick="openSettings()">Configuración</button>
    <span id="accountArea"></span>
  </div>
</header>

<section id="auth" class="card auth">
  <h2 id="authTitle" style="margin-top:0">Iniciar sesión</h2>
  <div class="tabs">
    <button type="button" class="btn primary" id="tabLogin" onclick="switchAuth('login')">Iniciar sesión</button>
    <button type="button" class="btn" id="tabRegister" onclick="switchAuth('register')">Crear cuenta</button>
  </div>
  <div class="field"><label>Usuario</label><input id="username" maxlength="16" autocomplete="username" spellcheck="false"></div>
  <div class="field"><label>Contraseña</label><input id="password" type="password" maxlength="128" autocomplete="current-password"></div>
  <div class="field hidden" id="confirmWrap"><label>Repite la contraseña</label><input id="confirmPassword" type="password" maxlength="128" autocomplete="new-password"></div>
  <div id="turnstileBox"></div>
  <button type="button" class="btn primary" style="width:100%" onclick="submitAuth()" id="authBtn">Iniciar sesión</button>
  <div id="authMsg" class="notice muted"></div>
  <p id="authHint" class="small muted">Inicia sesión para jugar y aparecer en el ranking global.</p>
</section>

<div id="app" class="hidden">
  <div class="grid">
    <main class="card hero">
      <div class="status"><span>Jugador: <strong id="playerName"></strong></span><span>Puntos: <strong id="score">0</strong></span></div>
      <div id="gameArea" style="margin-top:16px"></div>
    </main>
    <aside class="card">
      <h2 style="margin-top:0">Ranking global</h2>
      <div id="ranking" class="table-wrap"></div>
    </aside>
  </div>

  <section id="settings" class="card hidden">
    <h2>Configuración</h2>
    <div class="settings">
      <div class="row"><span>Idioma</span><select id="lang" onchange="setLang(this.value)" style="max-width:180px"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option></select></div>
      <div class="row"><span>Sonidos</span><button class="btn" id="soundBtn" onclick="toggleSound()"></button></div>
      <div class="row"><span>Modo oscuro</span><button class="btn" id="themeBtn" onclick="toggleTheme()"></button></div>
    </div>
  </section>

  <section id="devPanel" class="card hidden dev">
    <h2 style="margin-top:0">Consola de desarrollador</h2>
    <p class="muted small">Acceso administrativo. Los cambios se aplican en el servidor.</p>
    <div id="devStats" class="status"></div>
    <div id="devUsers" class="table-wrap" style="margin-top:12px"></div>
    <div id="devAudit" class="table-wrap" style="margin-top:18px"></div>
    <button class="btn danger" onclick="closeDev()">Cerrar consola</button>
  </section>
</div>
<div class="footer">FUTBOLIQ · Quiz de fútbol</div>
</div>
<script>
let mode="login", user=null, gameId=null, devOpen=false;
let sound=localStorage.getItem("fql_sound")!=="off";
let theme=localStorage.getItem("fql_theme")||"dark";
let lang=localStorage.getItem("fql_lang")||"es";
let widgetId=null, turnstileReady=false, turnstileConfig=null, turnstileRendering=false, turnstileWaiter=null;
const $=id=>document.getElementById(id);
const T={
es:{login:"Iniciar sesión",register:"Crear cuenta",account:"Cuenta",start:"Empezar partida",next:"Siguiente",finish:"Partida terminada",points:"Puntos",settings:"Configuración",soundOn:"Activado",soundOff:"Desactivado",dark:"Oscuro",light:"Claro"},
en:{login:"Log in",register:"Create account",account:"Account",start:"Start game",next:"Next",finish:"Game over",points:"Points",settings:"Settings",soundOn:"On",soundOff:"Off",dark:"Dark",light:"Light"},
pt:{login:"Entrar",register:"Criar conta",account:"Conta",start:"Começar partida",next:"Próxima",finish:"Partida terminada",points:"Pontos",settings:"Configuração",soundOn:"Ativado",soundOff:"Desativado",dark:"Escuro",light:"Claro"}
};
function tr(k){return (T[lang]||T.es)[k]||k}
function applyPrefs(){document.documentElement.classList.toggle("light",theme==="light");$("soundBtn").textContent=sound?tr("soundOn"):tr("soundOff");$("themeBtn").textContent=theme==="dark"?tr("dark"):tr("light");$("lang").value=lang}
function setLang(v){lang=v;localStorage.setItem("fql_lang",v);applyPrefs();if(gameId) refreshMe()}
function toggleSound(){sound=!sound;localStorage.setItem("fql_sound",sound?"on":"off");applyPrefs();if(sound)beep(660)}
function toggleTheme(){
  theme=theme==="dark"?"light":"dark";
  localStorage.setItem("fql_theme",theme);
  applyPrefs();
  if(widgetId!==null){
    removeTurnstile();
    turnstileReady=false;
    turnstileRendering=false;
    renderTurnstile();
  }
}
function beep(freq=520){if(!sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch{}}
function openSettings(){$("settings").classList.toggle("hidden")}
function api(path,options={}){return fetch(path,{credentials:"same-origin",headers:{"content-type":"application/json",...(options.headers||{})},...options}).then(async r=>{let x={};try{x=await r.json()}catch{};if(!r.ok)throw new Error(x.error||"Error");return x})}
function switchAuth(m){
  mode=m;
  const registering=m==="register";
  $("authTitle").textContent=registering?"Crear una cuenta":"Iniciar sesión";
  $("authBtn").textContent=registering?"Crear mi cuenta":"Entrar";
  $("tabLogin").className="btn"+(!registering?" primary":"");
  $("tabRegister").className="btn"+(registering?" primary":"");
  $("password").autocomplete=registering?"new-password":"current-password";
  $("confirmWrap").classList.toggle("hidden",!registering);
  $("authHint").textContent=registering?"Usa un nombre único de 3 a 16 caracteres.":"Escribe tus datos y pulsa Entrar.";
  $("authMsg").textContent="";
  if(widgetId!==null)resetTurnstile();
  else if(!turnstileRendering)renderTurnstile();
}
function removeTurnstile(){
  if(turnstileWaiter){
    try{turnstileWaiter.reject(new Error("CAPTCHA reiniciado."))}catch{}
    turnstileWaiter=null;
  }
  if(widgetId!==null && window.turnstile){
    try{turnstile.remove(widgetId)}catch{}
  }
  widgetId=null;
}
function resetTurnstile(){
  if(widgetId!==null && window.turnstile){
    try{turnstile.reset(widgetId)}catch{removeTurnstile()}
  }
}
let turnstileAttempts=0;
function renderTurnstile(){
  if(turnstileRendering)return;
  turnstileRendering=true;
  api("/api/config").then(config=>{
    turnstileConfig=config;
    if(!config.turnstileSiteKey){
      turnstileRendering=false;
      $("turnstileBox").innerHTML="<div class='small muted'>CAPTCHA no configurado todavía en Cloudflare.</div>";
      return;
    }
    window.__tsSiteKey=config.turnstileSiteKey;
    const tryRender=()=>{
      if(widgetId!==null || !turnstileConfig || turnstileRendering===false)return;
      if(window.turnstile){
        try{
          $("turnstileBox").innerHTML="";
          widgetId=turnstile.render($("turnstileBox"),{
            sitekey:turnstileConfig.turnstileSiteKey,
            theme:theme==="dark"?"dark":"light",
            appearance:"interaction-only",
            execution:"execute",
            retry:"never",
            callback:(token)=>{
              turnstileReady=!!token;
              if(turnstileWaiter){
                const w=turnstileWaiter;
                turnstileWaiter=null;
                w.resolve(token);
              }
            },
            "expired-callback":()=>{
              turnstileReady=false;
              if(turnstileWaiter){
                const w=turnstileWaiter;
                turnstileWaiter=null;
                w.reject(new Error("El CAPTCHA expiró. Inténtalo de nuevo."));
              }
            },
            "error-callback":()=>{
              turnstileReady=false;
              if(turnstileWaiter){
                const w=turnstileWaiter;
                turnstileWaiter=null;
                w.reject(new Error("No se pudo completar el CAPTCHA."));
              }
            }
          });
          turnstileReady=false;
          turnstileRendering=false;
        }catch(e){
          turnstileRendering=false;
          $("turnstileBox").innerHTML="<div class='small muted'>No se pudo cargar el CAPTCHA. Comprueba el dominio autorizado en Cloudflare Turnstile.</div>";
        }
      }else if(turnstileAttempts++<40){
        setTimeout(tryRender,250);
      }else{
        turnstileRendering=false;
        $("turnstileBox").innerHTML="<div class='small muted'>El CAPTCHA no terminó de cargar. Recarga la página.</div>";
      }
    };
    tryRender();
  }).catch(()=>{
    turnstileRendering=false;
    $("turnstileBox").innerHTML="<div class='small muted'>No se pudo conectar con la configuración del CAPTCHA.</div>";
  });
}
function tokenValue(){
  if(!window.turnstile || widgetId===null || !turnstileReady)return "";
  try{return turnstile.getResponse(widgetId)||""}catch{return ""}
}
function executeTurnstile(){
  if(tokenValue()) return Promise.resolve(tokenValue());
  if(!window.turnstile || widgetId===null) return Promise.reject(new Error("El CAPTCHA todavía no está listo."));
  if(turnstileWaiter) return turnstileWaiter.promise;
  const promise=new Promise((resolve,reject)=>{
    turnstileWaiter={resolve,reject,promise:null};
  });
  turnstileWaiter.promise=promise;
  try{
    turnstileReady=false;
    turnstile.execute(widgetId);
  }catch(e){
    const w=turnstileWaiter;
    turnstileWaiter=null;
    w.reject(new Error("No se pudo iniciar el CAPTCHA."));
  }
  return promise;
}
async function submitAuth(){
  const username=$("username").value.trim();
  const password=$("password").value;
  $("authMsg").textContent="";
  if(!username){$("authMsg").textContent="Escribe un nombre de usuario.";return}
  if(mode==="register" && password!==$("confirmPassword").value){$("authMsg").textContent="Las contraseñas no coinciden.";return}
  const btn=$("authBtn");
  btn.disabled=true;
  btn.textContent="Comprobando…";
  try{
    const path=mode==="login"?"/api/login":"/api/register";
    const tsToken=await executeTurnstile();
    const x=await api(path,{method:"POST",body:JSON.stringify({username,password,turnstileToken:tsToken})});
    user=x.user;
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("playerName").textContent=user.username;
    accountUI();
    startGame();
    loadRanking();
  }catch(e){
    $("authMsg").textContent=e.message;
    turnstileReady=false;
    resetTurnstile();
  }finally{
    btn.disabled=false;
    btn.textContent=mode==="register"?"Crear mi cuenta":"Entrar";
  }
}
async function refreshMe(){try{const x=await api("/api/me");user=x.user;if(user){$("playerName").textContent=user.username}}catch{}}
async function startGame(){
  try{const x=await api("/api/game",{method:"POST",body:"{}"});gameId=x.gameId;$("score").textContent="0";showQuestion(x.question)}catch(e){$("gameArea").innerHTML="<p class='muted'>"+e.message+"</p>"}
}
function showQuestion(q){
  $("gameArea").innerHTML="<div class='muted small'>"+q.category+"</div><h1 class='question'>"+escapeHtml(q.q)+"</h1><div class='options'>"+q.options.map((o,i)=>"<button class='btn option' onclick='answer("+i+")'>"+escapeHtml(o)+"</button>").join("")+"</div>";
}
async function answer(i){
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);
  try{const x=await api("/api/answer",{method:"POST",body:JSON.stringify({gameId,choice:i})});$("score").textContent=x.score;beep(x.correct?720:220);if(x.done){$("gameArea").innerHTML="<h2>"+tr("finish")+"</h2><p>"+tr("points")+": <strong>"+x.score+"</strong></p><button class='btn primary' onclick='startGame()'>"+tr("start")+"</button>";gameId=null;loadRanking()}else showQuestion(x.question)}catch(e){$("gameArea").innerHTML="<p class='muted'>"+e.message+"</p>"}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function loadRanking(){try{const x=await api("/api/ranking");$("ranking").innerHTML="<table><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Partidas</th></tr></thead><tbody>"+x.ranking.map((r,i)=>"<tr><td>"+(i+1)+"</td><td>"+escapeHtml(r.username)+"</td><td>"+r.score+"</td><td>"+r.games+"</td></tr>").join("")+"</tbody></table>"}catch{}}
async function logout(){
  try{await api("/api/logout",{method:"POST"})}
  finally{location.reload()}
}
function accountUI(){if(!user)return;$("accountArea").innerHTML="<span class='muted' style='margin-right:8px'>"+escapeHtml(user.username)+"</span><button class='btn' onclick='logout()'>Salir</button>"}
async function devConsole(){
  if(!user || user.role!=="admin"){alert("La consola requiere una cuenta administradora.");return}
  const code=prompt("Código de desarrollador:");
  if(code===null)return;
  try{await api("/api/dev/open",{method:"POST",body:JSON.stringify({code})});devOpen=true;$("devPanel").classList.remove("hidden");await loadDev();$("devPanel").scrollIntoView({behavior:"smooth"})}catch(e){alert(e.message)}
}
async function loadDev(){
  const [u,s,a]=await Promise.all([
    api("/api/dev/users"),
    api("/api/dev/stats"),
    api("/api/dev/audit")
  ]);

  $("devStats").innerHTML=
    "<span>Usuarios: <strong>"+s.users+"</strong></span>"+
    "<span>Partidas activas: <strong>"+s.activeGames+"</strong></span>"+
    "<span>Sesiones: <strong>"+s.activeSessions+"</strong></span>";

  const rows=(u.users||[]).map(r=>{
    const statusAction=r.status==="active"?"block":"unblock";
    const statusLabel=r.status==="active"?"Bloquear":"Desbloquear";
    const roleAction=r.role==="admin"?"demote":"promote";
    const roleLabel=r.role==="admin"?"Quitar admin":"Hacer admin";
    return "<tr>"+
      "<td>"+escapeHtml(r.username)+"</td>"+
      "<td>"+escapeHtml(r.role)+"</td>"+
      "<td>"+escapeHtml(r.status)+"</td>"+
      "<td>"+r.bestScore+"</td>"+
      "<td>"+r.games+"</td>"+
      "<td>"+
        "<button class='btn dev-score' data-id='"+r.id+"' data-delta='100'>+100</button>"+
        "<button class='btn dev-score' data-id='"+r.id+"' data-delta='-100'>-100</button>"+
        "<button class='btn dev-set' data-id='"+r.id+"'>Fijar</button>"+
        "<button class='btn dev-action' data-id='"+r.id+"' data-action='"+statusAction+"'>"+statusLabel+"</button>"+
        "<button class='btn dev-action' data-id='"+r.id+"' data-action='"+roleAction+"'>"+roleLabel+"</button>"+
        "<button class='btn danger dev-action' data-id='"+r.id+"' data-action='reset'>Reset</button>"+
      "</td>"+
    "</tr>";
  }).join("");

  $("devUsers").innerHTML=
    "<h3>Cuentas</h3>"+
    "<table><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Puntos</th><th>Partidas</th><th>Acciones</th></tr></thead>"+
    "<tbody>"+rows+"</tbody></table>";

  document.querySelectorAll(".dev-score").forEach(btn=>{
    btn.addEventListener("click",()=>devScore(Number(btn.dataset.id),Number(btn.dataset.delta)));
  });
  document.querySelectorAll(".dev-set").forEach(btn=>{
    btn.addEventListener("click",()=>devSet(Number(btn.dataset.id)));
  });
  document.querySelectorAll(".dev-action").forEach(btn=>{
    btn.addEventListener("click",()=>devAction(Number(btn.dataset.id),btn.dataset.action));
  });

  $("devAudit").innerHTML=
    "<h3>Registro</h3>"+
    "<table><thead><tr><th>Fecha</th><th>Admin</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>"+
    (a.logs||[]).map(l=>
      "<tr><td>"+new Date(l.createdAt).toLocaleString()+"</td>"+
      "<td>"+escapeHtml(l.actor||"—")+"</td>"+
      "<td>"+escapeHtml(l.action||"")+"</td>"+
      "<td>"+escapeHtml(l.details||"")+"</td></tr>"
    ).join("")+
    "</tbody></table>";

  accountUI();
}
async function devScore(id,delta){if(!confirm((delta>0?"+":"")+delta+" puntos?"))return;try{await api("/api/dev/users/"+id+"/score",{method:"POST",body:JSON.stringify({delta})});await loadDev();loadRanking()}catch(e){alert(e.message)}}
async function devSet(id){const score=prompt("Nueva puntuación:");if(score===null)return;try{await api("/api/dev/users/"+id+"/set-score",{method:"POST",body:JSON.stringify({score:Number(score)})});await loadDev();loadRanking()}catch(e){alert(e.message)}}
async function devAction(id,action){if(!confirm("¿Confirmar "+action+"?"))return;try{await api("/api/dev/users/"+id+"/"+action,{method:"POST",body:"{}"});await loadDev();loadRanking()}catch(e){alert(e.message)}}
async function closeDev(){await api("/api/dev/close",{method:"POST",body:"{}"});$("devPanel").classList.add("hidden");devOpen=false}
let seq="",seqTimer=0;
window.addEventListener("keydown",e=>{if(e.key.length!==1)return;seq=(seq+e.key.toLowerCase()).slice(-3);clearTimeout(seqTimer);seqTimer=setTimeout(()=>seq="",1200);if(seq==="ftb")devConsole()});
document.addEventListener("DOMContentLoaded",()=>{
  applyPrefs();
  accountUI();
  switchAuth("login");
  renderTurnstile();
});
</script>
</body>
</html>
